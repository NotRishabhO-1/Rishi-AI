<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rishi AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        :root { --sidebar-width: 280px; }
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .cursor-blink {
            display: inline-block; width: 8px; height: 18px;
            background: #3b82f6; margin-left: 2px;
            animation: blink 1s infinite; vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        #app { display: none; opacity: 0; transition: opacity 0.4s ease; }
        #loading {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: white; z-index: 9999;
        }
        .dark #loading { background: #0f172a; color: white; }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed; left: -280px; top: 0; bottom: 0;
                z-index: 50; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                width: var(--sidebar-width);
            }
            #sidebar.open { transform: translateX(280px); }
            #sidebar-overlay.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); z-index: 40; }
        }

        .prose pre { background: #f3f4f6; padding: 1rem; border-radius: 0.75rem; overflow-x: auto; margin: 0.5rem 0; border: 1px solid #e5e7eb; }
        .dark .prose pre { background: #1e293b; border-color: #334155; }
        .prose code { font-size: 0.875rem; color: #2563eb; font-weight: 600; }
        .dark .prose code { color: #60a5fa; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200">

    <div id="loading">
        <div class="relative w-16 h-16">
            <div class="absolute inset-0 border-4 border-blue-100 dark:border-slate-800 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
        </div>
        <p class="mt-4 font-semibold tracking-wide animate-pulse text-slate-600 dark:text-slate-400">RISHI AI</p>
    </div>

    <div id="app" class="flex min-h-screen">
        <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="w-[280px] flex-shrink-0 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col h-screen">
            <div class="p-4 flex flex-col h-full">
                <div class="flex items-center gap-2 px-2 mb-6">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">R</div>
                    <span class="font-bold text-xl tracking-tight">Rishi AI</span>
                </div>

                <button onclick="createNewChat()" class="flex items-center justify-center gap-2 px-4 py-3 bg-slate-900 dark:bg-blue-600 text-white rounded-xl hover:opacity-90 transition-all font-medium mb-4 shadow-sm">
                    <span>+ New Chat</span>
                </button>

                <div class="flex-1 overflow-y-auto space-y-1 pr-1" id="chat-history-list"></div>

                <div class="mt-auto pt-4 border-t border-slate-200 dark:border-slate-700 space-y-1">
                    <button onclick="toggleDarkMode()" class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">
                        <span id="theme-icon">🌙</span> <span id="theme-text" class="text-sm font-medium">Dark Mode</span>
                    </button>
                    <button onclick="openSettings()" class="w-full flex items-center gap-3 px-3 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">
                        <span class="text-sm">⚙️</span> <span class="text-sm font-medium text-slate-600 dark:text-slate-300">Settings</span>
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen relative bg-white dark:bg-slate-900">
            <header class="h-16 flex items-center justify-between px-4 border-b border-slate-100 dark:border-slate-800">
                <button onclick="toggleSidebar()" class="md:hidden p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
                <div class="font-bold text-slate-700 dark:text-slate-200 truncate max-w-[200px]" id="current-chat-title">New Chat</div>
                <div class="w-10"></div>
            </header>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 md:p-10 space-y-8">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center max-w-xl mx-auto py-20">
                    <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-4xl font-bold mb-6 shadow-xl">R</div>
                    <h1 class="text-3xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4">How can I help you today?</h1>
                    <p class="text-slate-500 dark:text-slate-400 text-lg">Rishi AI is ready to assist with code, writing, or analysis.</p>
                </div>
            </div>

            <div class="p-4 md:pb-8 bg-gradient-to-t from-white via-white to-transparent dark:from-slate-900 dark:via-slate-900">
                <div class="max-w-4xl mx-auto relative group">
                    <textarea id="user-input" rows="1" 
                        class="w-full p-4 pr-16 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none resize-none transition-all shadow-lg text-slate-700 dark:text-slate-200"
                        placeholder="Type a message..."></textarea>
                    <button id="send-btn" onclick="handleSendMessage()" 
                        class="absolute right-3 bottom-3 p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-all shadow-md disabled:opacity-40">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                    </button>
                </div>
            </div>
        </main>

        <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
            <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-200 dark:border-slate-700">
                <h2 class="text-2xl font-bold mb-2">Configuration</h2>
                <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Settings are saved in your browser.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">OpenRouter API Key</label>
                        <input type="password" id="api-key-input" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 outline-none focus:ring-2 focus:ring-blue-500" placeholder="sk-or-v1-...">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Model ID</label>
                        <input type="text" id="model-input" class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 outline-none focus:ring-2 focus:ring-blue-500" placeholder="deepseek/deepseek-r1:free">
                    </div>
                    <div class="flex gap-3 mt-8">
                        <button onclick="closeSettings()" class="flex-1 px-4 py-3 rounded-xl font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 transition">Cancel</button>
                        <button onclick="saveSettings()" class="flex-1 px-4 py-3 rounded-xl font-semibold bg-blue-600 text-white hover:bg-blue-700 transition">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Reactive State
        let state = {
            apiKey: localStorage.getItem('rishi_api_key') || '',
            model: localStorage.getItem('rishi_model') || 'deepseek/deepseek-r1:free',
            isDarkMode: localStorage.getItem('rishi_dark_mode') === 'true',
            chats: JSON.parse(localStorage.getItem('rishi_chats')) || [],
            activeChatId: null,
            isStreaming: false
        };

        const chatContainer = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const historyList = document.getElementById('chat-history-list');

        // Fail-safe init
        function init() {
            try {
                if (state.isDarkMode) document.documentElement.classList.add('dark');
                updateThemeUI();
                renderHistory();
                autoResizeInput();
                
                userInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleSendMessage();
                    }
                });
                console.log("Rishi AI Core Ready");
            } catch (err) {
                console.error("Init Error:", err);
            } finally {
                const loader = document.getElementById('loading');
                const app = document.getElementById('app');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    app.style.display = 'flex';
                    setTimeout(() => app.style.opacity = '1', 50);
                }, 400);
            }
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text || state.isStreaming) return;
            if (!state.apiKey) {
                alert('Please set your API Key in Settings first.');
                return openSettings();
            }

            if (!state.activeChatId) createNewChat(false);
            
            const chat = state.chats.find(c => c.id === state.activeChatId);
            chat.messages.push({ role: 'user', content: text });
            
            userInput.value = '';
            userInput.style.height = 'auto';
            renderMessages();
            await streamAIResponse(chat);
        }

        async function streamAIResponse(chat) {
            state.isStreaming = true;
            setBtnState(true);
            
            const aiMsg = { role: 'assistant', content: '' };
            chat.messages.push(aiMsg);
            
            const msgEl = createMsgEl('assistant', '');
            chatContainer.appendChild(msgEl);
            const contentEl = msgEl.querySelector('.msg-c');
            
            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${state.apiKey}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: state.model,
                        messages: chat.messages.slice(0, -1),
                        stream: true
                    })
                });

                if (!res.ok) throw new Error(await res.text());

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunks = decoder.decode(value).split('\n');
                    for (const chunk of chunks) {
                        if (!chunk.trim() || chunk.includes('[DONE]')) continue;
                        try {
                            const json = JSON.parse(chunk.replace('data: ', ''));
                            const token = json.choices[0]?.delta?.content || '';
                            aiMsg.content += token;
                            contentEl.innerHTML = marked.parse(aiMsg.content + '<span class="cursor-blink"></span>');
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        } catch (e) {}
                    }
                }
            } catch (err) {
                aiMsg.content = `**System Error:** ${err.message}`;
            } finally {
                contentEl.innerHTML = marked.parse(aiMsg.content);
                state.isStreaming = false;
                setBtnState(false);
                save();
                renderHistory();
            }
        }

        function createNewChat(render = true) {
            const id = Date.now().toString();
            state.chats.unshift({ id, title: 'New Chat', messages: [] });
            state.activeChatId = id;
            save();
            renderHistory();
            if (render) renderMessages();
            if (window.innerWidth < 768) toggleSidebar();
        }

        function renderMessages() {
            const chat = state.chats.find(c => c.id === state.activeChatId);
            chatContainer.innerHTML = '';
            
            if (!chat || chat.messages.length === 0) {
                document.getElementById('welcome-screen').style.display = 'flex';
                document.getElementById('current-chat-title').innerText = "Rishi AI";
                return;
            }

            document.getElementById('welcome-screen').style.display = 'none';
            const firstMsg = chat.messages.find(m => m.role === 'user');
            document.getElementById('current-chat-title').innerText = firstMsg ? firstMsg.content.substring(0, 25) + '...' : 'New Chat';

            chat.messages.forEach(m => chatContainer.appendChild(createMsgEl(m.role, m.content)));
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function createMsgEl(role, content) {
            const d = document.createElement('div');
            d.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} animate-in fade-in slide-in-from-bottom-2`;
            d.innerHTML = `
                <div class="max-w-[85%] md:max-w-[75%] p-4 rounded-2xl ${role === 'user' 
                    ? 'bg-blue-600 text-white rounded-tr-none shadow-md' 
                    : 'bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 prose dark:prose-invert rounded-tl-none shadow-sm'}">
                    <div class="msg-c">${role === 'assistant' ? marked.parse(content) : content}</div>
                </div>`;
            return d;
        }

        function renderHistory() {
            historyList.innerHTML = '';
            state.chats.forEach(c => {
                const active = state.activeChatId === c.id;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${active ? 'bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400' : 'hover:bg-slate-100 dark:hover:bg-slate-700/50'}`;
                div.onclick = () => { state.activeChatId = c.id; renderMessages(); renderHistory(); if(window.innerWidth < 768) toggleSidebar(); };
                
                const title = c.messages.length > 0 ? c.messages[0].content : 'New Chat';
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="text-xs">●</span>
                        <span class="truncate text-sm font-medium">${title}</span>
                    </div>
                    <button onclick="event.stopPropagation(); deleteChat('${c.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-500 transition">✕</button>
                `;
                historyList.appendChild(div);
            });
        }

        function deleteChat(id) {
            state.chats = state.chats.filter(c => c.id !== id);
            if (state.activeChatId === id) state.activeChatId = null;
            save(); renderHistory(); renderMessages();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        }

        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('rishi_dark_mode', state.isDarkMode);
            updateThemeUI();
        }

        function updateThemeUI() {
            document.getElementById('theme-icon').innerText = state.isDarkMode ? '☀️' : '🌙';
            document.getElementById('theme-text').innerText = state.isDarkMode ? 'Light Mode' : 'Dark Mode';
        }

        function openSettings() {
            document.getElementById('api-key-input').value = state.apiKey;
            document.getElementById('model-input').value = state.model;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function saveSettings() {
            state.apiKey = document.getElementById('api-key-input').value.trim();
            state.model = document.getElementById('model-input').value.trim() || 'deepseek/deepseek-r1:free';
            localStorage.setItem('rishi_api_key', state.apiKey);
            localStorage.setItem('rishi_model', state.model);
            closeSettings();
        }

        function save() { localStorage.setItem('rishi_chats', JSON.stringify(state.chats)); }

        function autoResizeInput() {
            userInput.oninput = function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            };
        }

        function setBtnState(loading) {
            const btn = document.getElementById('send-btn');
            btn.disabled = loading;
            btn.innerHTML = loading ? `<div class="w-5 h-5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>` : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>`;
        }

        // Boot
        if (document.readyState === 'complete') init();
        else window.addEventListener('load', init);
    </script>
</body>
</html>
