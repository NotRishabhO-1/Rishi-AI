<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universal AI Chat Interface</title>
  <!-- Tailwind CDN (Play) -->
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"></script>
  <style>
    /* Ensure code blocks use monospace and wrap */
    pre { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; white-space: pre-wrap; }
    code { font-family: ui-monospace, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    /* Mobile safe area bottom */
    body { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="min-h-screen flex bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <!-- Loading Fallback -->
  <div id="loading" class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 text-gray-500">
    Loading App...
  </div>
  <!-- App Container -->
  <div id="app" class="hidden flex-1 flex flex-col">
    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar -->
      <aside id="sidebar" class="flex flex-col w-64 bg-gray-100 dark:bg-gray-800 p-4 space-y-4 hidden lg:flex">
        <button id="newChatBtn" class="flex items-center px-3 py-2 bg-white dark:bg-gray-700 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700">
          <span class="mr-2">+</span> New Chat
        </button>
        <div class="flex-1 overflow-y-auto mt-2">
          <ul id="chatList" class="space-y-2">
            <!-- Chat items inserted here -->
          </ul>
        </div>
        <div class="pt-4 border-t border-gray-300 dark:border-gray-700 flex items-center justify-between">
          <button id="darkToggleBtn" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded-md">
            🌙
          </button>
          <button id="settingsBtn" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded-md">
            ⚙️
          </button>
        </div>
      </aside>
      <!-- Main Area -->
      <main class="flex-1 flex flex-col">
        <!-- Top bar (mobile) -->
        <div class="flex items-center justify-between p-2 bg-gray-100 dark:bg-gray-800 border-b border-gray-300 dark:border-gray-700 lg:hidden">
          <button id="toggleSidebarBtn" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded-md">☰</button>
          <div>
            <button id="darkToggleBtn2" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded-md mr-2">🌙</button>
            <button id="settingsBtn2" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded-md">⚙️</button>
          </div>
        </div>
        <!-- Chat Messages -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-white dark:bg-gray-900 pb-24">
          <!-- Messages will appear here -->
        </div>
        <!-- Input Bar -->
        <div id="inputBar" class="fixed bottom-0 inset-x-0 bg-white dark:bg-gray-800 border-t border-gray-300 dark:border-gray-700 p-4 flex items-end">
          <textarea id="messageInput" class="flex-1 resize-none border border-gray-300 dark:border-gray-600 rounded-md p-2 mr-2 bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100" rows="1" placeholder="Type a message..."></textarea>
          <button id="sendBtn" class="px-4 py-2 bg-blue-600 text-white rounded-md">Send</button>
        </div>
      </main>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-gray-800 bg-opacity-50 hidden items-center justify-center">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-md w-11/12 max-w-md">
      <h2 class="text-lg font-bold mb-4">Settings</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">OpenRouter API Key:</label>
          <input id="apiKeyInput" type="password" class="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 bg-gray-50 dark:bg-gray-700" placeholder="sk-..." />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Model Name:</label>
          <input id="modelInput" type="text" class="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 bg-gray-50 dark:bg-gray-700" placeholder="deepseek/deepseek-r1:free" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">System Prompt (per chat):</label>
          <textarea id="systemPromptInput" class="w-full border border-gray-300 dark:border-gray-600 rounded-md p-2 bg-gray-50 dark:bg-gray-700" rows="3" placeholder="You are a helpful assistant."></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-4">
          <button id="closeSettings" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400">Cancel</button>
          <button id="saveSettings" class="px-4 py-2 bg-blue-600 text-white rounded-md">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialization
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.remove('hidden');

    // Elements
    const sidebar = document.getElementById('sidebar');
    const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
    const darkToggleBtn = document.getElementById('darkToggleBtn');
    const darkToggleBtn2 = document.getElementById('darkToggleBtn2');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsBtn2 = document.getElementById('settingsBtn2');
    const settingsModal = document.getElementById('settingsModal');
    const closeSettings = document.getElementById('closeSettings');
    const saveSettings = document.getElementById('saveSettings');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const modelInput = document.getElementById('modelInput');
    const systemPromptInput = document.getElementById('systemPromptInput');
    const newChatBtn = document.getElementById('newChatBtn');
    const chatListElem = document.getElementById('chatList');
    const messagesElem = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    // State
    let chats = JSON.parse(localStorage.getItem('chats') || '[]');
    if (!Array.isArray(chats) || chats.length === 0) {
      chats = [{ id: Date.now(), name: 'New Chat', messages: [], systemPrompt: '' }];
    }
    let activeChatId = chats[0].id;
    let isWaitingResponse = false;

    // Load settings
    let apiKey = localStorage.getItem('apiKey') || '';
    let model = localStorage.getItem('model') || 'deepseek/deepseek-r1:free';
    let theme = localStorage.getItem('theme') || '';
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
      darkToggleBtn.textContent = '☀️';
      darkToggleBtn2.textContent = '☀️';
    } else {
      document.documentElement.classList.remove('dark');
      darkToggleBtn.textContent = '🌙';
      darkToggleBtn2.textContent = '🌙';
    }

    apiKeyInput.value = apiKey;
    modelInput.value = model;
    const activeChat = () => chats.find(c => c.id === activeChatId);
    if (activeChat() && activeChat().systemPrompt) {
      systemPromptInput.value = activeChat().systemPrompt;
    }

    // Render chat list
    function renderChatList() {
      chatListElem.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('li');
        item.className = 'flex items-center justify-between p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-md';
        item.dataset.id = chat.id;
        const title = document.createElement('span');
        title.textContent = chat.name || 'Chat';
        title.className = 'flex-1';
        if (chat.id === activeChatId) {
          title.classList.add('font-bold');
        }
        item.appendChild(title);
        const renameBtn = document.createElement('button');
        renameBtn.innerHTML = '✏️';
        renameBtn.title = 'Rename';
        renameBtn.className = 'px-1';
        renameBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const newName = prompt('Enter chat name:', chat.name);
          if (newName) {
            chat.name = newName;
            localStorage.setItem('chats', JSON.stringify(chats));
            renderChatList();
          }
        });
        item.appendChild(renameBtn);
        const deleteBtn = document.createElement('button');
        deleteBtn.innerHTML = '🗑️';
        deleteBtn.title = 'Delete';
        deleteBtn.className = 'px-1';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('Delete this chat?')) {
            chats = chats.filter(c => c.id !== chat.id);
            if (activeChatId === chat.id) {
              activeChatId = chats.length ? chats[0].id : null;
            }
            localStorage.setItem('chats', JSON.stringify(chats));
            renderChatList();
            renderMessages();
          }
        });
        item.appendChild(deleteBtn);
        item.addEventListener('click', () => {
          activeChatId = chat.id;
          localStorage.setItem('chats', JSON.stringify(chats));
          renderChatList();
          renderMessages();
          const ac = activeChat();
          systemPromptInput.value = ac ? (ac.systemPrompt || '') : '';
        });
        chatListElem.appendChild(item);
      });
    }

    // Render messages for active chat
    function renderMessages() {
      const chat = activeChat();
      messagesElem.innerHTML = '';
      if (!chat) return;
      chat.messages.forEach(msg => {
        const wrapper = document.createElement('div');
        wrapper.className = 'flex';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'whitespace-pre-wrap';
        contentDiv.innerHTML = marked.parse(msg.content);
        if (msg.role === 'user') {
          wrapper.classList.add('justify-end');
          contentDiv.className += ' bg-blue-600 text-white';
        } else {
          contentDiv.className += ' bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-gray-100';
        }
        contentDiv.className += ' p-2 rounded-md max-w-[80%]';
        wrapper.appendChild(contentDiv);
        messagesElem.appendChild(wrapper);
      });
      messagesElem.scrollTop = messagesElem.scrollHeight;
    }

    // New chat
    newChatBtn.addEventListener('click', () => {
      const newChat = { id: Date.now(), name: 'New Chat', messages: [], systemPrompt: '' };
      chats.push(newChat);
      activeChatId = newChat.id;
      localStorage.setItem('chats', JSON.stringify(chats));
      renderChatList();
      renderMessages();
      systemPromptInput.value = '';
    });

    // Toggle sidebar (mobile)
    toggleSidebarBtn.addEventListener('click', () => {
      if (sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('hidden');
      } else {
        sidebar.classList.add('hidden');
      }
    });

    // Dark mode toggle
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      darkToggleBtn.textContent = isDark ? '☀️' : '🌙';
      darkToggleBtn2.textContent = isDark ? '☀️' : '🌙';
    }
    darkToggleBtn.addEventListener('click', toggleDarkMode);
    darkToggleBtn2.addEventListener('click', toggleDarkMode);

    // Settings modal
    settingsBtn.addEventListener('click', () => { settingsModal.classList.remove('hidden'); });
    settingsBtn2.addEventListener('click', () => { settingsModal.classList.remove('hidden'); });
    closeSettings.addEventListener('click', () => { settingsModal.classList.add('hidden'); });
    saveSettings.addEventListener('click', () => {
      apiKey = apiKeyInput.value.trim();
      model = modelInput.value.trim() || 'deepseek/deepseek-r1:free';
      localStorage.setItem('apiKey', apiKey);
      localStorage.setItem('model', model);
      const chat = activeChat();
      if (chat) {
        chat.systemPrompt = systemPromptInput.value.trim();
      }
      localStorage.setItem('chats', JSON.stringify(chats));
      settingsModal.classList.add('hidden');
    });

    // Send message (user)
    async function sendMessage() {
      const chat = activeChat();
      if (!chat) return;
      const text = messageInput.value.trim();
      if (!text || isWaitingResponse) return;
      chat.messages.push({ role: 'user', content: text });
      localStorage.setItem('chats', JSON.stringify(chats));
      renderMessages();
      messageInput.value = '';
      await getAIResponse();
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Get AI response (streaming)
    async function getAIResponse() {
      const chat = activeChat();
      if (!chat) return;
      if (!apiKey) {
        alert('Please set OpenRouter API Key in settings.');
        return;
      }
      isWaitingResponse = true;
      const assistantMsg = { role: 'assistant', content: '' };
      chat.messages.push(assistantMsg);
      renderMessages();
      messagesElem.scrollTop = messagesElem.scrollHeight;
      const systemPrompt = chat.systemPrompt || '';
      const messagesPayload = [];
      if (systemPrompt) {
        messagesPayload.push({ role: 'system', content: systemPrompt });
      }
      chat.messages.slice().forEach(msg => {
        if (msg === assistantMsg) return;
        messagesPayload.push({ role: msg.role, content: msg.content });
      });
      const controller = new AbortController();
      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: model,
            messages: messagesPayload,
            stream: true
          }),
          signal: controller.signal
        });
        if (!response.ok) {
          const err = await response.json();
          console.error(err);
          alert('Error from API: ' + (err.error?.message || response.statusText));
          isWaitingResponse = false;
          return;
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let done = false;
        while (!done) {
          const { value, done: doneReading } = await reader.read();
          if (doneReading) break;
          buffer += decoder.decode(value, { stream: true });
          let parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const part of parts) {
            if (part.startsWith("data: ")) {
              const data = part.replace("data: ", "").trim();
              if (data === "[DONE]") {
                done = true;
                break;
              }
              try {
                const json = JSON.parse(data);
                const delta = json.choices?.[0]?.delta?.content;
                if (delta) {
                  for (const char of delta) {
                    assistantMsg.content += char;
                    const lastMsgDiv = messagesElem.querySelector('div.flex:last-child div');
                    if (lastMsgDiv) {
                      lastMsgDiv.innerHTML = marked.parse(assistantMsg.content);
                    }
                    messagesElem.scrollTop = messagesElem.scrollHeight;
                    await new Promise(r => setTimeout(r, 20));
                  }
                }
              } catch (err) {
                console.error("Stream parse error", err);
              }
            }
          }
        }
      } catch (err) {
        console.error(err);
        alert('Request error: ' + err);
      } finally {
        localStorage.setItem('chats', JSON.stringify(chats));
        renderChatList();
        isWaitingResponse = false;
        messagesElem.scrollTop = messagesElem.scrollHeight;
      }
    }

    // Initial render
    renderChatList();
    renderMessages();
  </script>
</body>
</html>
