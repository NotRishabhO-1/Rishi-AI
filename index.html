<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #131314; color: #e3e3e3; font-family: 'Google Sans', Arial, sans-serif; }
        .chat-container { max-width: 850px; margin: 0 auto; padding: 20px; height: calc(100vh - 180px); overflow-y: auto; }
        .user-bubble { background: #282a2d; padding: 12px 20px; border-radius: 24px; margin-bottom: 20px; align-self: flex-end; display: inline-block; }
        .ai-bubble { margin-bottom: 30px; line-height: 1.7; font-size: 1.05rem; }
        .input-box { max-width: 850px; margin: 0 auto; background: #1e1f20; border-radius: 32px; padding: 8px 20px; display: flex; align-items: center; }
        input { background: transparent; border: none; outline: none; color: white; flex-grow: 1; padding: 12px; font-size: 16px; }
        /* Hide scrollbar */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="p-6 text-xl font-semibold text-gray-300">Rishi AI</header>

    <main id="chat-window" class="chat-container flex flex-col">
        <div class="ai-bubble text-3xl font-light text-gray-500 mt-20">
            Hello! I'm Rishi.<br>How can I help you sparkle today?
        </div>
    </main>

    <footer class="p-4 bg-[#131314]">
        <div class="input-box border border-transparent focus-within:border-gray-600">
            <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn" class="text-blue-400 hover:text-blue-300 p-2">
                <svg viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <p class="text-center text-[10px] text-gray-600 mt-4">Rishi AI is built for learning. Check important info for accuracy.</p>
    </footer>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const input = document.getElementById('user-input');
        const btn = document.getElementById('send-btn');

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Display User Message
            const uDiv = document.createElement('div');
            uDiv.innerHTML = `<div class="user-bubble">${text}</div>`;
            uDiv.className = "text-right";
            chatWindow.appendChild(uDiv);
            
            input.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Show "Thinking" placeholder
            const aiDiv = document.createElement('div');
            aiDiv.className = "ai-bubble text-gray-400 italic";
            aiDiv.innerText = "Rishi is thinking...";
            chatWindow.appendChild(aiDiv);

            // Fetch from Backend
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                aiDiv.className = "ai-bubble"; // Remove italic/gray
                aiDiv.innerText = data.reply;
            } catch (err) {
                aiDiv.innerText = "Error connecting to Rishi AI.";
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        btn.onclick = sendMessage;
        input.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
